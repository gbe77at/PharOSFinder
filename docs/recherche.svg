<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Pharos Finder — déroulé d'une recherche</title>
  <style>
    .bg{fill:#ffffff} .ink{fill:#1f2328} .muted{fill:#59636e}
    .zone{fill:#f6f8fa;stroke:#d1d9e0} .step{fill:#ddf4ff;stroke:#54aeff} .opt{fill:#fbefff;stroke:#c297ff}
    .bgjob{fill:#fff8c5;stroke:#d4a72c} .num{fill:#0969da} .numt{fill:#ffffff;font-weight:700}
    .line{stroke:#59636e;fill:none;stroke-width:1.6} .arrow{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .ink{fill:#e6edf3} .muted{fill:#9198a1}
      .zone{fill:#151b23;stroke:#3d444d} .step{fill:#0c2d4a;stroke:#1f6feb} .opt{fill:#2d1a4a;stroke:#8957e5}
      .bgjob{fill:#3b2e05;stroke:#9e6a03} .num{fill:#1f6feb} .line{stroke:#9198a1} .arrow{fill:#9198a1}
    }
    text{font-size:13px} .h1{font-size:22px;font-weight:700} .h2{font-size:14.5px;font-weight:700} .sm{font-size:11.5px}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="ink h1" x="32" y="42">Déroulé d'une recherche (bouton « Rechercher ») — ~25 s sur un /24</text>
  <text class="muted" x="32" y="64">Étapes dans l'ordre ; « Stop » arrête proprement et annonce les étapes sautées. Toute étape de plus de 20 s est journalisée.</text>

  <rect class="step" x="32" y="88" width="264" height="118" rx="8"/>
  <circle class="num" cx="56" cy="112" r="13"/><text class="numt" x="51.5" y="117">1</text>
  <text class="ink h2" x="78" y="117">Balayage de la plage</text>
  <text class="ink sm" x="48" y="142">Ping de chaque adresse (≤ /24)</text>
  <text class="ink sm" x="48" y="160">puis lecture de la table ARP :</text>
  <text class="ink sm" x="48" y="178">trouve aussi qui ignore le ping</text>
  <line class="line" x1="296" y1="147" x2="324" y2="147" marker-end="url(#a)"/>

  <rect class="step" x="326" y="88" width="264" height="118" rx="8"/>
  <circle class="num" cx="350" cy="112" r="13"/><text class="numt" x="345.5" y="117">2</text>
  <text class="ink h2" x="372" y="117">Plages d'usine</text>
  <text class="ink sm" x="342" y="142">Alias temporaire 192.168.0.x / 1.x</text>
  <text class="ink sm" x="342" y="160">(+ plages ajoutées dans Options)</text>
  <text class="ink sm" x="342" y="178">gardé seulement si un équipement répond</text>
  <line class="line" x1="590" y1="147" x2="618" y2="147" marker-end="url(#a)"/>

  <rect class="step" x="620" y="88" width="264" height="118" rx="8"/>
  <circle class="num" cx="644" cy="112" r="13"/><text class="numt" x="639.5" y="117">3</text>
  <text class="ink h2" x="666" y="117">Noms Bonjour (mDNS)</text>
  <text class="ink sm" x="636" y="142">PTR, puis TXT + SRV de chaque instance</text>
  <text class="ink sm" x="636" y="160">QNAP (port, QTS), Fire TV, OctoPrint,</text>
  <text class="ink sm" x="636" y="178">Moonraker, AirPlay…</text>
  <line class="line" x1="884" y1="147" x2="912" y2="147" marker-end="url(#a)"/>

  <rect class="step" x="914" y="88" width="254" height="118" rx="8"/>
  <circle class="num" cx="938" cy="112" r="13"/><text class="numt" x="933.5" y="117">4</text>
  <text class="ink h2" x="960" y="117">UniFi et NETGEAR</text>
  <text class="ink sm" x="930" y="142">UDP 10001 : modèle, firmware,</text>
  <text class="ink sm" x="930" y="160">non adopté · NSDP (2 envois) :</text>
  <text class="ink sm" x="930" y="178">modèle, nom, IP, DHCP, firmware</text>

  <path class="line" d="M1041,206 L1041,226 L164,226 L164,248" marker-end="url(#a)"/>

  <rect class="step" x="32" y="250" width="264" height="118" rx="8"/>
  <circle class="num" cx="56" cy="274" r="13"/><text class="numt" x="51.5" y="279">5</text>
  <text class="ink h2" x="78" y="279">Identification</text>
  <text class="ink sm" x="48" y="304">16 équipements en parallèle : fabricant,</text>
  <text class="ink sm" x="48" y="322">ports, page web, SSH, Echo / Fire TV,</text>
  <text class="ink sm" x="48" y="340">QNAP, Moonraker (:7125 / :4408)</text>
  <line class="line" x1="296" y1="309" x2="324" y2="309" marker-end="url(#a)"/>

  <rect class="step" x="326" y="250" width="264" height="118" rx="8"/>
  <circle class="num" cx="350" cy="274" r="13"/><text class="numt" x="345.5" y="279">6</text>
  <text class="ink h2" x="372" y="279">Noms DNS et routeur</text>
  <text class="ink sm" x="342" y="304">DNS inverse (abandon après 5 s)</text>
  <text class="ink sm" x="342" y="322">passerelle par défaut → « Routeur »</text>
  <line class="line" x1="590" y1="309" x2="618" y2="309" marker-end="url(#a)"/>

  <rect class="opt" x="620" y="250" width="264" height="118" rx="8"/>
  <circle class="num" cx="644" cy="274" r="13"/><text class="numt" x="639.5" y="279">7</text>
  <text class="ink h2" x="666" y="279">Comptes (si configurés)</text>
  <text class="ink sm" x="636" y="304">Tuya : noms, types, capteurs</text>
  <text class="ink sm" x="636" y="322">Zigbee/BLE, firmware</text>
  <text class="ink sm" x="636" y="340">UniFi : état, mises à jour</text>
  <line class="line" x1="884" y1="309" x2="912" y2="309" marker-end="url(#a)"/>

  <rect class="step" x="914" y="250" width="254" height="118" rx="8"/>
  <circle class="num" cx="938" cy="274" r="13"/><text class="numt" x="933.5" y="279">8</text>
  <text class="ink h2" x="960" y="279">IPv6 link-local</text>
  <text class="ink sm" x="930" y="304">ping ff02::1 + voisins :</text>
  <text class="ink sm" x="930" y="322">un Pharos de plage inconnue,</text>
  <text class="ink sm" x="930" y="340">relais web local si besoin</text>

  <rect class="zone" x="32" y="400" width="1136" height="210" rx="10"/>
  <text class="muted h2" x="48" y="426">En permanence, en arrière-plan (sans action)</text>
  <rect class="bgjob" x="48" y="440" width="268" height="154" rx="8"/>
  <text class="ink h2" x="62" y="464">Annonces CDP / LLDP</text>
  <text class="ink sm" x="62" y="486">tcpdump, chaque interface (root)</text>
  <text class="ink sm" x="62" y="504">PharOS annonce toutes les 60 s :</text>
  <text class="ink sm" x="62" y="522">IP, modèle, firmware, quelle</text>
  <text class="ink sm" x="62" y="540">que soit sa plage IP</text>
  <text class="muted sm" x="62" y="570">Ex. CPE510 v3.0, 192.168.0.254</text>

  <rect class="bgjob" x="328" y="440" width="268" height="154" rx="8"/>
  <text class="ink h2" x="342" y="464">Tuya / Smart Life</text>
  <text class="ink sm" x="342" y="486">UDP 6666 · 6667 · 7000</text>
  <text class="ink sm" x="342" y="504">ID, productKey, protocole</text>
  <text class="ink sm" x="342" y="522">l'IP de l'expéditeur fait foi</text>
  <text class="ink sm" x="342" y="540">sans droits admin</text>
  <text class="muted sm" x="342" y="570">Mac, PC et Linux</text>

  <rect class="bgjob" x="608" y="440" width="268" height="154" rx="8"/>
  <text class="ink h2" x="622" y="464">Bambu Lab (SSDP)</text>
  <text class="ink sm" x="622" y="486">UDP 1990 / 2021, rien n'est envoyé</text>
  <text class="ink sm" x="622" y="504">modèle (N7 = P2S), série,</text>
  <text class="ink sm" x="622" y="522">firmware, mode LAN ou cloud</text>
  <text class="ink sm" x="622" y="540">ports partagés (Bambu Studio)</text>
  <text class="muted sm" x="622" y="570">Ex. P2S « 3DP-22E-755 », fw 01.02</text>

  <rect class="bgjob" x="888" y="440" width="264" height="154" rx="8"/>
  <text class="ink h2" x="902" y="464">Écoute passive (bouton)</text>
  <text class="ink sm" x="902" y="486">180 s, toutes les trames :</text>
  <text class="ink sm" x="902" y="504">ARP, DHCP, TDP 20002, CDP</text>
  <text class="ink sm" x="902" y="522">pcap TDP / TP-Link à analyser</text>
  <text class="ink sm" x="902" y="540">conflits d'adresse signalés</text>
  <text class="muted sm" x="902" y="570">tcpdump · AF_PACKET · SIO_RCVALL</text>
</svg>
